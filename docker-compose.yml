# =============================================================================
# Docker Compose — Componente B (Despliegue Real en EC2 t3.micro, 1 GiB RAM)
# Solo el puerto de la API se expone; PostgreSQL permanece aislado en red privada.
# Presupuesto combinado: 192m (Go API) + 256m (PostgreSQL) = 448m (< 45% RAM).
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: voltrix-mantenimiento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltrix_mantenimiento}
      POSTGRES_USER: ${POSTGRES_USER:-voltrix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "effective_cache_size=128MB"
      - "-c"
      - "max_connections=30"
    volumes:
      - voltrix_mantenimiento_pgdata:/var/lib/postgresql/data
    networks:
      - voltrix_net
    # IMPORTANTE: NO se publican puertos de PostgreSQL al host (red privada)
    mem_limit: 256m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voltrix_user} -d ${POSTGRES_DB:-voltrix_mantenimiento}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: jonmeister/voltrix-mantenimiento-api:${SERVICE_VERSION:-1.0.0}
    pull_policy: missing
    container_name: voltrix-mantenimiento-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_PORT: "8080"
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      DEFAULT_WORKERS: ${DEFAULT_WORKERS:-2}
      RETRY_AFTER_SECONDS: ${RETRY_AFTER_SECONDS:-2}
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-3}
      URL_INVENTARIO: ${URL_INVENTARIO:-}
      URL_ALERTAS: ${URL_ALERTAS:-}
      URL_REPORTES: ${URL_REPORTES:-}
      URL_PRONOSTICOS: ${URL_PRONOSTICOS:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-voltrix_user}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-voltrix_mantenimiento}?sslmode=disable
    networks:
      - voltrix_net
    mem_limit: 192m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  voltrix_net:
    driver: bridge

volumes:
  voltrix_mantenimiento_pgdata:

