# PLANTILLA SEGURA — Copiar a k8s/secret.yaml (ignorado por .gitignore)
# o crear directamente con kubectl create secret generic mantenimiento-secret ...
apiVersion: v1
kind: Secret
metadata:
  name: mantenimiento-secret
  labels:
    app: voltrix-mantenimiento
    equipo: equipo-6
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CAMBIAR_PASSWORD_SEGURO"
  DATABASE_URL: "postgres://voltrix_user:CAMBIAR_PASSWORD_SEGURO@mantenimiento-db:5432/voltrix_mantenimiento?sslmode=disable"

