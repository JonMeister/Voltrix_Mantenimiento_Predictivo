apiVersion: apps/v1
kind: Deployment
metadata:
  name: mantenimiento-db
  labels:
    app: mantenimiento-db
    equipo: equipo-6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mantenimiento-db
  template:
    metadata:
      labels:
        app: mantenimiento-db
        equipo: equipo-6
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "shared_buffers=64MB"
            - "-c"
            - "work_mem=2MB"
            - "-c"
            - "max_connections=30"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: mantenimiento-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: mantenimiento-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mantenimiento-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mantenimiento-db
  labels:
    app: mantenimiento-db
    equipo: equipo-6
spec:
  type: ClusterIP
  selector:
    app: mantenimiento-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

