  <script>
    const spec = {"openapi": "3.0.3", "info": {"title": "Voltrix Energy \u00b7 Mantenimiento Predictivo", "version": "1.0.0", "description": "Contrato HTTP del servicio **Mantenimiento Predictivo** (Equipo 6).\n\nGenera y gestiona \u00f3rdenes de mantenimiento programado y predictivo para los activos f\u00edsicos\n(paneles solares, turbinas e\u00f3licas y bancos de bater\u00edas) de las microplantas de Voltrix Energy,\na partir del estado operativo de los activos, las alertas activas, el hist\u00f3rico de generaci\u00f3n y\nel pron\u00f3stico de generaci\u00f3n.\n\n**T\u00e9cnica de paralelismo exigida:** Procesamiento paralelo por lotes de activos (descomposici\u00f3n\nde datos) para evaluar de forma concurrente el riesgo de falla de cada activo y generar las\n\u00f3rdenes de mantenimiento correspondientes.\n\n**Servicios que consume:**\n- **Equipo 1 \u2013 Inventario de Activos:** cat\u00e1logo de activos por planta y su estado operativo vigente.\n- **Equipo 3 \u2013 Alertas y Notificaciones:** alertas activas y condiciones cr\u00edticas/urgentes por planta y activo.\n- **Equipo 4 \u2013 Reportes de Generaci\u00f3n:** agregados hist\u00f3ricos de energ\u00eda generada por planta, activo y periodo.\n- **Equipo 5 \u2013 Pron\u00f3stico de Generaci\u00f3n:** proyecci\u00f3n de generaci\u00f3n esperada por planta.\n\n**Consumidores previstos**\n\n| Equipo | Servicio | Operaciones que usa |\n|---|---|---|\n| 7 | Facturaci\u00f3n y Liquidaci\u00f3n | `GET /mantenimiento/ordenes`, `GET /mantenimiento/ordenes/{id}` |\n\n**Convenciones comunes a todos los equipos**\n\n- Fechas en RFC 3339 **con zona horaria** (`2026-11-19T14:00:00Z`).\n- Identificadores de plantas y activos seg\u00fan Inventario (Equipo 1): `PL-001`, `PL-001-PS-07`.\n- Cada consumidor env\u00eda `X-Equipo-Consumidor: equipo-<N>`; toda respuesta incluye `X-Request-Id`.\n  Ambos se escriben en los logs como evidencia de consumo real.\n- Errores con el esquema com\u00fan `Error` (`codigo`, `mensaje`, `requestId`, `detalles`).\n- `429` con `Retry-After` ante sobrecarga, `503` si la base de datos no responde y `502` si un\n  servicio de otro equipo del que se depende falla.\n- `GET /health` y `GET /openapi.yaml` existen en todos los servicios.\n- Las operaciones de procesamiento intensivo aceptan `modo` (`secuencial` | `paralelo`) y\n  `workers`, y devuelven `MetricasProcesamiento` para comparar ambas versiones.\n", "contact": {"name": "Equipo 6 \u00b7 Mantenimiento Predictivo (Contacto - Jonathan Aristiz\u00e1bal, Tel. 3114322544)"}}, "servers": [{"url": "http://{host}:{puerto}", "description": "Despliegue del Componente B (EC2) o entorno local. La direcci\u00f3n vigente est\u00e1 en la hoja Coordinacion_Voltrix.", "variables": {"host": {"default": "localhost", "description": "IP p\u00fablica o DNS de la instancia EC2."}, "puerto": {"default": "8080"}}}], "tags": [{"name": "Mantenimiento", "description": "Consulta y gesti\u00f3n del ciclo de vida de las \u00f3rdenes de mantenimiento predictivo."}, {"name": "Procesamiento", "description": "Operaci\u00f3n intensiva con la t\u00e9cnica de paralelismo o concurrencia exigida al equipo (procesamiento paralelo por lotes de activos)."}, {"name": "Operaci\u00f3n", "description": "Salud del servicio y publicaci\u00f3n del contrato."}], "paths": {"/mantenimiento/ordenes": {"get": {"tags": ["Mantenimiento"], "operationId": "listarOrdenesMantenimiento", "summary": "Listar \u00f3rdenes de mantenimiento con filtros y paginaci\u00f3n", "description": "Devuelve una p\u00e1gina de \u00f3rdenes de mantenimiento filtrable por planta, activo, estado,\nprioridad, tipo de mantenimiento y rango de fechas (`desde` y `hasta`).\n\nDise\u00f1ado para soportar tanto la consulta operativa como el consumo por parte del\n**Equipo 7 (Facturaci\u00f3n y Liquidaci\u00f3n)** para consolidar costos de mantenimiento por\nplanta y periodo de liquidaci\u00f3n.\n", "parameters": [{"$ref": "#/components/parameters/EquipoConsumidor"}, {"name": "plantaId", "in": "query", "required": false, "description": "Filtrar \u00f3rdenes pertenecientes a una microplanta espec\u00edfica.", "schema": {"$ref": "#/components/schemas/Identificador"}}, {"name": "activoId", "in": "query", "required": false, "description": "Filtrar \u00f3rdenes asociadas a un activo f\u00edsico espec\u00edfico.", "schema": {"$ref": "#/components/schemas/Identificador"}}, {"name": "estado", "in": "query", "required": false, "description": "Filtrar por estado actual de la orden.", "schema": {"$ref": "#/components/schemas/EstadoOrden"}}, {"name": "prioridad", "in": "query", "required": false, "description": "Filtrar por nivel de prioridad de la orden.", "schema": {"$ref": "#/components/schemas/PrioridadOrden"}}, {"name": "tipoMantenimiento", "in": "query", "required": false, "description": "Filtrar por tipo de mantenimiento.", "schema": {"$ref": "#/components/schemas/TipoMantenimiento"}}, {"name": "desde", "in": "query", "required": false, "description": "Fecha y hora inicial (RFC 3339 con zona horaria) para filtrar por `generadoEn`.", "schema": {"type": "string", "format": "date-time"}, "example": "2026-11-01T00:00:00-05:00"}, {"name": "hasta", "in": "query", "required": false, "description": "Fecha y hora final (RFC 3339 con zona horaria) para filtrar por `generadoEn`.", "schema": {"type": "string", "format": "date-time"}, "example": "2026-11-30T23:59:59-05:00"}, {"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "P\u00e1gina de \u00f3rdenes de mantenimiento.", "headers": {"X-Request-Id": {"$ref": "#/components/headers/X-Request-Id"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PaginaOrdenesMantenimiento"}, "example": {"datos": [{"id": "OM-20261119-001", "plantaId": "PL-001", "activoId": "PL-001-PS-07", "tipoActivo": "panel_solar", "tipoMantenimiento": "predictivo", "prioridad": "alta", "estado": "programada", "puntajeRiesgo": 78.5, "motivo": "Ca\u00edda sostenida de generaci\u00f3n (-24.3%) y 2 alertas cr\u00edticas activas.", "costoEstimado": 450000, "moneda": "COP", "fechaProgramada": "2026-11-22T09:00:00-05:00", "generadoEn": "2026-11-19T14:00:00Z", "factoresEvaluados": {"estadoActivo": "degradado", "alertasActivas": 3, "alertasCriticas": 2, "eficienciaHistoricaPct": 75.7, "desviacionPronosticoPct": -18.2}}], "total": 1, "costoTotalEstimado": 450000, "limit": 50, "offset": 0}}}}, "400": {"$ref": "#/components/responses/SolicitudInvalida"}, "429": {"$ref": "#/components/responses/Sobrecarga"}, "503": {"$ref": "#/components/responses/NoDisponible"}}}}, "/mantenimiento/ordenes/{id}": {"get": {"tags": ["Mantenimiento"], "operationId": "consultarOrdenMantenimiento", "summary": "Consultar una orden de mantenimiento por identificador", "parameters": [{"$ref": "#/components/parameters/OrdenId"}, {"$ref": "#/components/parameters/EquipoConsumidor"}], "responses": {"200": {"description": "Orden de mantenimiento encontrada.", "headers": {"X-Request-Id": {"$ref": "#/components/headers/X-Request-Id"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OrdenMantenimiento"}, "examples": {"ejemplo": {"$ref": "#/components/examples/OrdenMantenimientoEjemplo"}}}}}, "404": {"$ref": "#/components/responses/NoEncontrado"}, "429": {"$ref": "#/components/responses/Sobrecarga"}, "503": {"$ref": "#/components/responses/NoDisponible"}}}, "patch": {"tags": ["Mantenimiento"], "operationId": "actualizarOrdenMantenimiento", "summary": "Actualizar el estado o programaci\u00f3n de una orden de mantenimiento", "description": "Permite actualizar el estado operativo de una orden (`programada` \u2192 `en_progreso` \u2192\n`completada` o `cancelada`), ajustar la fecha programada o actualizar el costo estimado\ntras la inspecci\u00f3n t\u00e9cnica. Devuelve `409` si la orden se encuentra en un estado terminal\n(`completada` o `cancelada`) y no admite la transici\u00f3n solicitada.\n", "parameters": [{"$ref": "#/components/parameters/OrdenId"}, {"$ref": "#/components/parameters/EquipoConsumidor"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SolicitudActualizacionOrden"}, "example": {"estado": "completada", "costoEstimado": 480000, "observaciones": "Se reemplaz\u00f3 inversor secundario y se limpi\u00f3 arreglo fotovoltaico."}}}}, "responses": {"200": {"description": "Orden de mantenimiento actualizada.", "headers": {"X-Request-Id": {"$ref": "#/components/headers/X-Request-Id"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OrdenMantenimiento"}, "example": {"id": "OM-20261119-001", "plantaId": "PL-001", "activoId": "PL-001-PS-07", "tipoActivo": "panel_solar", "tipoMantenimiento": "predictivo", "prioridad": "alta", "estado": "completada", "puntajeRiesgo": 78.5, "motivo": "Ca\u00edda sostenida de generaci\u00f3n (-24.3%) y 2 alertas cr\u00edticas activas.", "costoEstimado": 480000, "moneda": "COP", "fechaProgramada": "2026-11-22T09:00:00-05:00", "generadoEn": "2026-11-19T14:00:00Z", "actualizadoEn": "2026-11-22T15:30:00Z", "observaciones": "Se reemplaz\u00f3 inversor secundario y se limpi\u00f3 arreglo fotovoltaico.", "factoresEvaluados": {"estadoActivo": "degradado", "alertasActivas": 3, "alertasCriticas": 2, "eficienciaHistoricaPct": 75.7, "desviacionPronosticoPct": -18.2}}}}}, "400": {"$ref": "#/components/responses/SolicitudInvalida"}, "404": {"$ref": "#/components/responses/NoEncontrado"}, "409": {"$ref": "#/components/responses/Conflicto"}, "429": {"$ref": "#/components/responses/Sobrecarga"}, "503": {"$ref": "#/components/responses/NoDisponible"}}}}, "/mantenimiento/generar": {"post": {"tags": ["Procesamiento"], "operationId": "generarOrdenesMantenimiento", "summary": "Evaluar lotes de activos y generar \u00f3rdenes de mantenimiento predictivo", "description": "Ejecuta el procesamiento intensivo del servicio de Mantenimiento Predictivo:\n\n1. **Recolecci\u00f3n de insumos:** consulta los servicios configurados de Inventario de Activos\n   (Equipo 1), Alertas y Notificaciones (Equipo 3), Reportes de Generaci\u00f3n (Equipo 4) y\n   Pron\u00f3stico de Generaci\u00f3n (Equipo 5) para las plantas o activos solicitados en el rango\n   `[desde, hasta]`.\n2. **Descomposici\u00f3n de datos por lotes de activos:** particiona el conjunto de activos\n   recolectados en lotes independientes (tama\u00f1o `tamanoLote` o partici\u00f3n equilibrada seg\u00fan\n   `workers`). Cada worker eval\u00faa en paralelo el estado operativo, el conteo y severidad de\n   alertas, la tendencia/eficiencia hist\u00f3rica y la desviaci\u00f3n respecto al pron\u00f3stico para\n   calcular el puntaje de riesgo (`0..100`), clasificar prioridad/tipo y estimar el costo.\n3. **Modos de ejecuci\u00f3n:** con `modo=secuencial` se eval\u00faan todos los activos en un \u00fanico\n   hilo de ejecuci\u00f3n (l\u00ednea base, `workers=1`); con `modo=paralelo` se aplica el\n   procesamiento paralelo por lotes usando `workers` trabajadores concurrentes.\n4. **Persistencia y m\u00e9tricas:** guarda en base de datos las \u00f3rdenes cuyo puntaje supere\n   `umbralRiesgo` y retorna `MetricasProcesamiento` con el tiempo exacto de evaluaci\u00f3n\n   (`duracionMs`) y el n\u00famero de activos evaluados (`elementos`) para benchmarking reproducible.\n", "parameters": [{"$ref": "#/components/parameters/EquipoConsumidor"}, {"$ref": "#/components/parameters/Modo"}, {"$ref": "#/components/parameters/Workers"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SolicitudGeneracionOrdenes"}, "example": {"plantaIds": ["PL-001", "PL-002"], "desde": "2026-11-01T00:00:00-05:00", "hasta": "2026-11-18T23:59:59-05:00", "umbralRiesgo": 50, "tamanoLote": 25}}}}, "responses": {"200": {"description": "Evaluaci\u00f3n completada y \u00f3rdenes generadas.", "headers": {"X-Request-Id": {"$ref": "#/components/headers/X-Request-Id"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResultadoGeneracionOrdenes"}, "example": {"loteId": "7b4e1c9d-2f5a-4d8e-a1b3-6c9d0e2f4a8b", "activosEvaluados": 120, "generados": 2, "costoTotalEstimado": 1300000, "resumenPorPrioridad": {"baja": 0, "media": 0, "alta": 1, "critica": 1}, "ordenes": [{"id": "OM-20261119-001", "plantaId": "PL-001", "activoId": "PL-001-PS-07", "tipoActivo": "panel_solar", "tipoMantenimiento": "predictivo", "prioridad": "alta", "estado": "programada", "puntajeRiesgo": 78.5, "motivo": "Ca\u00edda sostenida de generaci\u00f3n (-24.3%) y 2 alertas cr\u00edticas activas.", "costoEstimado": 450000, "moneda": "COP", "fechaProgramada": "2026-11-22T09:00:00-05:00", "generadoEn": "2026-11-19T14:00:00Z", "factoresEvaluados": {"estadoActivo": "degradado", "alertasActivas": 3, "alertasCriticas": 2, "eficienciaHistoricaPct": 75.7, "desviacionPronosticoPct": -18.2}}, {"id": "OM-20261119-002", "plantaId": "PL-002", "activoId": "PL-002-BB-01", "tipoActivo": "banco_baterias", "tipoMantenimiento": "correctivo", "prioridad": "critica", "estado": "programada", "puntajeRiesgo": 92.0, "motivo": "Sobrecalentamiento recurrente en banco de bater\u00edas y estado en falla.", "costoEstimado": 850000, "moneda": "COP", "fechaProgramada": "2026-11-20T08:00:00-05:00", "generadoEn": "2026-11-19T14:00:00Z", "factoresEvaluados": {"estadoActivo": "falla", "alertasActivas": 5, "alertasCriticas": 4, "eficienciaHistoricaPct": 58.0, "desviacionPronosticoPct": -31.5}}], "metricas": {"modo": "paralelo", "workers": 4, "elementos": 120, "duracionMs": 42}}}}}, "400": {"$ref": "#/components/responses/SolicitudInvalida"}, "429": {"$ref": "#/components/responses/Sobrecarga"}, "502": {"$ref": "#/components/responses/DependenciaFallida"}, "503": {"$ref": "#/components/responses/NoDisponible"}}}}, "/health": {"get": {"tags": ["Operaci\u00f3n"], "operationId": "consultarSalud", "summary": "Comprobar la disponibilidad del servicio y de su base de datos", "description": "No exige `X-Equipo-Consumidor`. Debe responder r\u00e1pido y sin llamar a otros equipos de forma bloqueante.", "responses": {"200": {"description": "Servicio disponible.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Salud"}, "example": {"estado": "disponible", "baseDatos": "ok", "version": "1.0.0", "tiempoActivoSeg": 3600}}}}, "503": {"description": "El servicio no puede acceder a su base de datos.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Salud"}, "example": {"estado": "no_disponible", "baseDatos": "error", "version": "1.0.0", "tiempoActivoSeg": 3600}}}}}}}, "/openapi.yaml": {"get": {"tags": ["Operaci\u00f3n"], "operationId": "obtenerContrato", "summary": "Descargar este contrato", "description": "URL que se registra en la columna \"URL del contrato OpenAPI\" de la hoja Coordinacion_Voltrix.", "responses": {"200": {"description": "Contrato en formato YAML.", "content": {"application/yaml": {"schema": {"type": "string"}}}}}}}}, "components": {"parameters": {"EquipoConsumidor": {"name": "X-Equipo-Consumidor", "in": "header", "required": false, "description": "Equipo que hace la llamada. Se registra en los logs como evidencia de consumo entre c\u00e9lulas.", "schema": {"type": "string", "pattern": "^equipo-[1-7]$", "example": "equipo-7"}}, "Limit": {"name": "limit", "in": "query", "required": false, "description": "Tama\u00f1o de p\u00e1gina.", "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}, "Offset": {"name": "offset", "in": "query", "required": false, "description": "N\u00famero de elementos a omitir.", "schema": {"type": "integer", "minimum": 0, "default": 0}}, "Modo": {"name": "modo", "in": "query", "required": false, "description": "Versi\u00f3n del procesamiento a ejecutar (l\u00ednea base o t\u00e9cnica paralela/concurrente).", "schema": {"type": "string", "enum": ["secuencial", "paralelo"], "default": "paralelo"}}, "Workers": {"name": "workers", "in": "query", "required": false, "description": "N\u00famero de hilos, goroutines, procesos o workers a usar en modo paralelo. Por defecto lo decide el servicio.", "schema": {"type": "integer", "minimum": 1, "maximum": 64}}, "OrdenId": {"name": "id", "in": "path", "required": true, "description": "Identificador \u00fanico de la orden de mantenimiento.", "schema": {"$ref": "#/components/schemas/Identificador"}, "example": "OM-20261119-001"}}, "headers": {"X-Request-Id": {"description": "Identificador de la petici\u00f3n, presente tambi\u00e9n en los logs del servicio.", "schema": {"type": "string", "format": "uuid"}}, "Retry-After": {"description": "Segundos que el consumidor debe esperar antes de reintentar.", "schema": {"type": "integer", "minimum": 1, "example": 1}}}, "responses": {"SolicitudInvalida": {"description": "La solicitud no cumple el contrato.", "headers": {"X-Request-Id": {"$ref": "#/components/headers/X-Request-Id"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"codigo": "SOLICITUD_INVALIDA", "mensaje": "La solicitud no cumple el contrato.", "requestId": "0a4e9c1d-3f2b-4e8a-b7c6-5d1e2f3a4b5c", "detalles": [{"campo": "desde", "problema": "debe ser una fecha RFC 3339 con zona horaria"}]}}}}, "NoEncontrado": {"description": "La orden de mantenimiento no existe.", "headers": {"X-Request-Id": {"$ref": "#/components/headers/X-Request-Id"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"codigo": "NO_ENCONTRADO", "mensaje": "La orden de mantenimiento OM-999 no existe.", "requestId": "9c2f7e4a-1d3b-4a6c-8e5f-0b7d9a1c3e2f"}}}}, "Conflicto": {"description": "Ya existe una orden con ese identificador o el estado actual impide la operaci\u00f3n.", "headers": {"X-Request-Id": {"$ref": "#/components/headers/X-Request-Id"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"codigo": "TRANSICION_INVALIDA", "mensaje": "La orden OM-20261119-001 ya est\u00e1 completada y no admite
